{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <h1 class="text-center" style="font-family:sans-serif;">Online Helping Tool For All Schools And Parents</h1>
    <script src="http://maps.google.com/maps?file=api&amp;v=2.x&amp;key=AIzaSyACgTHo7SLBqnZANd406ZF6h2xNMH58Flw" type="text/javascript"></script>
    <div class="container">

        <h3 class="text-center" style="font-family:sans-serif;">Our Available Teachers</h3>


        <div align="center" id="gmap" style="width:1110px; height:750px"></div>

        <br>

        <table class="table table-hover table-sm table-dark">
            <tbody id="myTable" align="center">
                <tr>
                    <th>Teacher</th>
                    <th>Class</th>
                </tr>
                {% for v in locator %}
                    <tr>
                        <td><a href="{% url 'teacher_profile_detail' v.teacher.teacher.pk %}">{{ v.teacher.teacher }}</a></td>
                        <td>{{ v.teacher.clas }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

{% endblock %}
