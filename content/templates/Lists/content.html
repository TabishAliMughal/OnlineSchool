{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <link href="{% static 'css/base.css' %}"/>
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">View All Contents</h2><hr/>
        <a class="btn btn-primary" href="{% url "content_form" %}">Add Another</a>
        <table class="table table-hover table-sm table-dark">
            <thead align="center">
                <tr>
                    <th>Class Name</th>
                    <th>Subject Name</th>
                    <th>Module Name</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            {% for i in list %}
            <tbody align="center">
                <tr>
                    <th><a href="{% url 'content' i.pk %}">{{ i.class_name }}</a></th>
                    <th>{{ i.subject }}</th>
                    <th>{{ i.module }}</th>
                    <th>{{ i.date }}</th>
                    <th><a class="btn btn-primary" href="{% url 'content_edit' i.pk %}">Edit</a><a href="{% url 'content_delete' i.pk %}" class="btn btn-primary">Delete</a></th>
                </tr>
            </tbody>
            {% endfor %}
        </table>
    </div>
    {% csrf_token %}
</form>

{% endblock %}
