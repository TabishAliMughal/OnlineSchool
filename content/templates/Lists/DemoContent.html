{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <link href="{% static 'css/base.css' %}"/>
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">All Periods Of {{ date }}</h2><hr/>
        <a><button class="btn btn-primary" onclick="sortTable()">Sort</button></a>
       <table class="table table-hover table-sm res-table " id="results"   id="myTable">
            <thead align="center">
                <tr>
                    <th>Period</th>
                    <th>Class</th>
                    <th>Subject</th>
                    <th>Module</th>
                </tr>
            </thead>
            {% for i in list %}
            <tbody id="myTable" align="center">
                <tr>
                    <td><a href="{% url 'content' i.pk %}">Period = {{ i.period }}</a></td>
                    <td>{{ i.class_name }}</td>
                    <td>{{ i.subject }}</td>
                    <td>{{ i.module }}</td>
                </tr>
            </tbody>
            {% endfor %}
        </table>
    </div>
    {% csrf_token %}
</form>

{% endblock %}
