{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <link href="{% static 'css/base.css' %}"/>
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">View All Classes</h2><hr/>
        <a class="btn btn-primary" href="{% url "class_form" %}">Add Another</a>
        <table class="table table-hover table-sm table-dark">
            <thead align="center">
                <tr>
                    <th>Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            {% for i in list %}
            <tbody align="center">
                <tr>
                    <th>{{ i.class_name }}</th>
                    <th><a class="btn btn-primary" href="{% url 'class_edit' i.pk %}">Edit</a><a href="{% url 'class_delete' i.pk %}" class="btn btn-primary" href="">Delete</a></th>
                    </tr>
            </tbody>
            {% endfor %}
        </table>
    </div>
    {% csrf_token %}
</form>

{% endblock %}
