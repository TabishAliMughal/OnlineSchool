{% extends "MainPage.html" %}
{% load static %}
{% block content %}
{% csrf_token %}
    <div class="container">
        <h2 class="text-center">Select Session</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <tbody id="myTable" align="center">
                {% for i in session %}
                    <tr>
                        <td><a href="{% url 'content_select' date class class_subjects i.pk %}">{{ i.session_number }}</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
