{% extends "MainPage.html" %}
{% load static %}
{% block content %}
<form method="POST">
{% csrf_token %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Select Date</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody  align="center">
                <tr>
                    <th><input type="date" name="date"/></th>
                </tr>
                <tr>
                    <th><input class="btn btn-primary" type="submit" value="Next"></th>
                </tr>
            </tbody>
        </table>
    </div>
</form>
{% endblock %}
