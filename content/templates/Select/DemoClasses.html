{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Select Class</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <tbody id="myTable" align="center">
                {% for i in classes %}
                    <tr>
                        <td><a style="width: 30%; font-size:20;" class="btn btn-primary" href="{% url 'demo_content' day i.pk %}">{{ i.class_name }}</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
