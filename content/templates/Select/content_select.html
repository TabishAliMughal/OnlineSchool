{% extends "MainPage.html" %}
{% load static %}
{% block content %}
{% csrf_token %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Select Content</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <tbody id="myTable"  align="center">
                {% for v in content %}
                    {% for i in v %}
                        <tr>
                            <td><a href="{% url 'content' i.code %}">{{ i.module }} > {{ i.title }}</a></td>
                        </tr>
                    {% endfor %}
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
