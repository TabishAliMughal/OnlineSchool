{% extends "MainPage.html" %}
{% load static %}
{% block content %}
{% csrf_token %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Select Content</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody  align="center">
                {% for i in content %}
                    <tr>
                        <th><a href="{% url 'content' i.code %}">{{ i.module }} > {{ i.title }}</a></th>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
