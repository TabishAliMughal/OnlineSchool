{% extends "MainPage.html" %}
{% load static %}
{% block content %}
{% csrf_token %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Select Subject</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody  align="center">
                {% for i in class_subjects %}
                    <tr>
                        <th><a href="{% url 'content_select' date class.code i.subject_name %}">{{ i.subject_name }}</a></th>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
