{% extends "MainPage.html" %}
{% load static %}
{% block content %}
{% csrf_token %}
    <div class="container">
        <h2 class="text-center">Select Subject</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <tbody id="myTable" align="center">
                {% for i in class_subjects %}
                    <tr>
                        <td><a href="{% url 'content_select' date class.code i.subject_name %}">{{ i.subject_name }}</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
