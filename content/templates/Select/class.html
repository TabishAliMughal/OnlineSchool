{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Select Class</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody  align="center">
                {% for i in class %}
                    <tr>
                        <th><a class="btn btn-primary" href="{% url 'subject_select' date i.code %}">{{ i.class_name }}</a></th>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
