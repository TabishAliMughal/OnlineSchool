{% extends "MainPage.html" %}
{% load static %}
{% block content %}
{% csrf_token %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Content</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <tbody id="myTable" align="center">
                <tr>
                    <td><a>Class : {{ content.class_name }}</a><br><br></td>
                </tr>
                <tr>
                    <td><a>Subject : {{ content.subject }}</a><br><br></td>
                </tr>
                <tr>
                    <td><a>Date : {{ content.date }}</a><br><br></td>
                </tr>
                <tr>
                    <td><a>Content Title : {{ content.title }}</a><br><br></td>
                </tr>
                <tr>
                    <td><a>{{ content.text }}</a><br><br></td>
                </tr>
                <tr>
                    <td><iframe width="751" height="422" src="{{ content.url }}" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></td>
                </tr>
            </tbody>
        </table>
    </div>
{% endblock %}
