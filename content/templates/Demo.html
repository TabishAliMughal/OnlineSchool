{% extends "MainPage.html" %}
{% block content %}
<h2 class="text-center" style="font-family:sans-serif;">Demo</h2>
<div class="container">
  <iframe style="width: 100%;height:75%;" src="https://www.youtube.com/embed/anRZvcRkTko" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"></iframe>
  <h6 class="text-center">Click on any Date</h6><hr/>
    <h6 align="center">July</h6><br>
      <ul class="wc-calendar__days-names">
        <li class="wc-calendar__days-names__item">Mon</li>
        <li class="wc-calendar__days-names__item">Tue</li>
        <li class="wc-calendar__days-names__item">Wed</li>
        <li class="wc-calendar__days-names__item">Thu</li>
        <li class="wc-calendar__days-names__item">Fri</li>
        <li class="wc-calendar__days-names__item">Sat</li>
        <li class="wc-calendar__days-names__item">Sun</li>
      </ul>
      <br>
      <ul class="wc-calendar__days-list">
        {% for i in date1 %}
            <a role="button" href="{% url 'demo_list' i %}" class="wc-calendar__days-list__item">{{ i }}</a>
        {% endfor %}
      </ul>
      <ul class="wc-calendar__days-list">
        {% for i in date2 %}
            <a role="button" href="{% url 'demo_list' i %}" class="wc-calendar__days-list__item">{{ i }}</a>
        {% endfor %}
      </ul>
    </div>
{% endblock %}
