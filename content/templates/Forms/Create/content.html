{% extends "MainPage.html" %}
{% block content %}
<form method="POST">
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Class Add Form</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Form</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Class Name</td>
                    <td>{{ form1.class_name }}</td>
                </tr>
                <tr>
                    <td>Subject Name</td>
                    <td>{{ form1.subject }}</td>
                </tr>
                <tr>
                    <td>Module Name</td>
                    <td>{{ form1.module }}</td>
                </tr>
                <tr>
                    <td>Date</td>
                    <td><input type="date" name="date" /></td>
                </tr>
                <tr>
                    <td>Title</td>
                    <td>{{ form1.title }}</td>
                </tr>
                <tr>
                    <td>Text</td>
                    <td>{{ form1.text }}</td>
                </tr>
                <tr id="url">
                    <td>Youtube Url(Embed)</td>
                    <td><div id="div-to-add"><input type="url" name="url" required /></div><br><button type="button" onClick="clone()" id="add-row">+</button></td>

                    <input type="hidden" value="1" id="total_chq">
                </tr>
                <tr>
                    <td>Submit</td>
                    <td><input class="btn btn-primary" type="submit" value="Add to Contents"></td>
                </tr>
            </tbody>
        </table>
    </div>
    {% csrf_token %}

</form>
<script>
    function clone(){
        var new_chq_no = parseInt($('#total_chq').val()) + 1;
        var new_input = "<input type='text' name='url' id=" + new_chq_no + " />";
        $('#div-to-add').append('<br><br>'+new_input);
    };        
</script>

{% endblock %}
