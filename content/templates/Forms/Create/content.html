{% extends "MainPage.html" %}
{% block content %}
<form method="POST" enctype="multipart/form-data">
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Class Add Form</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Form</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Class Name</td>
                    <td>{{ form1.class_name }}</td>
                </tr>
                <tr>
                    <td>Subject Name</td>
                    <td>{{ form1.subject }}</td>
                </tr>
                <tr>
                    <td>Module Name</td>
                    <td>{{ form1.module }}</td>
                </tr>
                <tr>
                    <td>Date</td>
                    <td><input type="date" name="date" /></td>
                </tr>
                <tr>
                    <td>Title</td>
                    <td>{{ form1.title }}</td>
                </tr>
                <tr>
                    <td>Text</td>
                    <td><input type="text" name="text" required /></td>
                </tr>
                <tr>
                    <td>For</td>
                    <td>{{ form1.therefor }}</td>
                </tr>
                <tr id="url">
                    <td>Youtube Url(Embed)</td>
                    <td><div id="div-to-add-url"><input type="url" name="url" required /></div><br><button type="button" onClick="clone1()" id="add-row">+</button></td>

                    <input type="hidden" value="1" id="total-url-fields">
                </tr>
                <tr id="image">
                    <td>Image</td>
                    <td><div id="div-to-add-image"><input type="file" name="image" accept="image/*" capture="camera" /></div><br><button type="button" onClick="clone2()" id="add-row">+</button></td>

                    <input type="hidden" value="1" id="total-image-fields">
                </tr>
                <tr>
                    <td>Submit</td>
                    <td><input class="btn btn-primary" type="submit" value="Add to Contents"></td>
                </tr>
            </tbody>
        </table>
    </div>
    {% csrf_token %}
</form>
<script>
    function clone1(){
        var new_chq_no = parseInt($('#total-url-fields').val()) + 1;
        var new_input = "<input type='text' name='url' id=" + new_chq_no + " />";
        $('#div-to-add-url').append('<br><br>'+new_input);
    };        
</script>
<script>
    function clone2(){
        var new_chq_no = parseInt($('#total-image-fields').val()) + 1;
        var new_input = "<input type='file' name='image' accept='image/*' capture='camera' " + new_chq_no + " required />";
        $('#div-to-add-image').append('<br><br>'+new_input);
    };        
</script>

{% endblock %}
