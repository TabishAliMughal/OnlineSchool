{% extends "MainPage.html" %}
{% block content %}
<form method="POST">
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Class Add Form</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Form</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Class Name</td>
                    <td>{{ form.class_name }}</td>
                </tr>
                <tr>
                    <td>Subjects</td>
                    <td>Check To Add</td>
                </tr>
                    {% for i in sub %}
                        <tr>
                            <td></td>
                            <td>{{ i }} <input type="checkbox" name="sub" value="{{ i.pk }}"></td>
                        </tr>
                    {% endfor %}
                <tr>
                    <td>Submit</td>
                    <td><input class="btn btn-primary" type="submit" value="Add to ClassSubjects"></td>
                </tr>
            </tbody>
        </table>
    </div>
    {% csrf_token %}

</form>

{% endblock %}
