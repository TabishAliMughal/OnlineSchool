{% extends "MainPage.html" %}
{% block content %}
<form method="POST">
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Class Add Form</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Form</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Class Name</td>
                    <td>{{ form.class_name }}</td>
                </tr>
                <tr>
                    <td>Subject Name</td>
                    <td>{{ form.subject }}</td>
                </tr>
                <tr>
                    <td>Module Name</td>
                    <td>{{ form.module }}</td>
                </tr>
                <tr>
                    <td>Date</td>
                    <td><input type="date" name="date" /></td>
                </tr>
                <tr>
                    <td>Title</td>
                    <td>{{ form.title }}</td>
                </tr>
                <tr>
                    <td>Text</td>
                    <td>{{ form.text }}</td>
                </tr>
                <tr>
                    <td>Youtube Url(Embed)</td>
                    <td>{{ form.url }}</td>
                </tr>
                <tr>
                    <td>Submit</td>
                    <td><input class="btn btn-primary" type="submit" value="Add to Contents"></td>
                </tr>
            </tbody>
        </table>
    </div>
    {% csrf_token %}

</form>

{% endblock %}
