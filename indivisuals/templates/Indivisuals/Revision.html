{% extends "MainPage.html" %}
{% load static %}
{% block content %}
<div class="container">
    <h2 class="text-center">Select Content</h2><hr/>
    <table  class="table table-hover table-sm res-table">
        <tbody id="myTable" align="center">
        {% for i in content %}
        <tr>
            <td><a href="{% url 'indivisual_content' i.pk %}">{{ i.text }}</a><br><br></td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
