{% extends "MainPage.html" %}
{% load static %}
{% block content %}
{% csrf_token %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">All Documents</h2><hr/>
        <br>
        <table  class="table table-hover table-sm res-table">
            <tbody id="myTable" align="center">
                {% for i in images %}
                    <tr>
                        <td><div style="text-align: left;position:absolute;"><a style="width: 75px;" class="btn btn-primary" href="#" onClick="zoomOut()" >-</a></div><div style="text-align: right;"><a style="width: 75px;" class="btn btn-primary" href="#" onClick="zoomIn()" >+</a></div></td>
                    </tr>
                    <tr>
                        <td><img id='pix' style="width: 50%;" class="text-center" class="img" src="{{ i.image.url }}"></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script type="text/javascript">
        function zoomIn() {
            var img = document.getElementById("pix");
            img.style.width = (img.clientWidth + 25) ;
        }
        function zoomOut() {
            var img = document.getElementById("pix");
            img.style.width = (img.clientWidth - 25) ;
        }
    </script>
{% endblock %}
