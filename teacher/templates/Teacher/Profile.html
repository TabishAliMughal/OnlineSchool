{% extends "MainPage.html" %}
{% block content %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">My Classes</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody  align="center">
                {% for i in class %}
                    <tr>
                        <th><a href="{% url 'teacher_class' i.pk %}" >{{ i.clas }}</a></th>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Current Exams</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody  align="center">
                {% for i in exam %}
                    {% if i == 'No Active Exams' %}
                        <tr>
                            <th><a>No Active Exams</a></th>
                        </tr>
                    {% else %}
                        <tr>
                            <th><a href="{% url 'teacher_class_exam' i.pk %}" >{{ i }}</a></th>
                        </tr>
                    {% endif %}
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
