{% extends "MainPage.html" %}
{% block content %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">All Intrested Teachers</h2><hr/>
       <table class="table table-hover table-sm res-table " id="results"   id="myTable">
            <thead align="center">
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Status</th>
                </tr>
            </thead>
            {% for i in Teachers %}
                <tbody id="myTable" align="center">
                    <tr>
                        <td>{{ i.name }}</td>
                        <td>{{ i.phone }}</td>
                        {% if i.seen == True %}
                            <td>Seen</td>
                        {% else %}
                            <td>Pending</td>
                        {% endif %}
                    </tr>
                </tbody>
            {% endfor %}
        </table>
    </div>
{% endblock %}
