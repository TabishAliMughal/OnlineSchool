{% extends "MainPage.html" %}
{% block content %}
<form method="POST">
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Let Us Know That You Are Intrested As A Parent</h2><hr/>
       <table  class="table table-hover table-sm res-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Form</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Your Name</td>
                    <td>{{ form.name }}</td>
                </tr>
                <tr>
                    <td>Student Name</td>
                    <td>{{ form.student_name }}</td>
                </tr>
                <tr>
                    <td>Contact(we will call you)</td>
                    <td>{{ form.phone }}</td>
                </tr>
                <tr>
                    <td>Email(Optional)</td>
                    <td>{{ form.email }}</td>
                </tr>
                <tr hidden>
                    <td><input type="checkbox" name="seen" /></td>
                </tr>
                <tr>
                    <td>Submit</td>
                    <td><input class="btn btn-primary" type="submit" value="Send Request"></td>
                </tr>
            </tbody>
        </table>
    </div>
    {% csrf_token %}
</form>
{% endblock %}
