{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <link href="{% static 'css/base.css' %}"/>
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">All Visited School Owners</h2><hr/>
        <a><button class="btn btn-primary" onclick="sortTable()">Sort</button></a>
       <table class="table table-hover table-sm res-table " id="results"   id="myTable">
            <thead align="center">
                <tr>
                    <th>School Name</th>
                    <th>Contact</th>
                    <th>Seen</th>
                </tr>
            </thead>
            {% for i in Schools %}
                <tbody id="myTable" align="center">
                    <tr>
                        <td>{{ i.school_name }}</td>
                        <td>{{ i.phone }}</td>
                        {% if i.seen == True %}
                            <td>Seen</td>
                        {% else %}
                            <td>Pending</td>
                        {% endif %}
                    </tr>
                </tbody>
            {% endfor %}
        </table>
    </div>

{% endblock %}
