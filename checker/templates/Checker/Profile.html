{% extends "MainPage.html" %}
{% block content %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">My Classes</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody id="myTable" align="center">
                {% for i in class %}
                    <tr>
                        <th><a href="{% url 'full_class' i.checker.pk %}" >{{ i.subject }}</a></th>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
