{% extends "MainPage.html" %}
{% block content %}
<div class="container">
    <h2 class="text-center" style="font-family:sans-serif;">Detail Of Teacher = {{ teacher }}</h2><hr/>
   <table  class="table table-hover table-sm res-table">
        <tbody id="myTable" align="center">
                <tr>
                    <td><a>User Name</a></td>
                    <td><a>{{ teacher.username }}</a></td>
                </tr>
                <tr>
                    <td><a>Email Address</a></td>
                    <td><a>{{ teacher.email }}</a></td>
                </tr>
                <tr>
                    <td><a>Date Joined</a></td>
                    <td><a>{{ teacher.date_joined }}</a></td>
                </tr>
                <tr>
                    <td><a>Date Joined</a></td>
                    <td><a>{{ teacher.last_login }}</a></td>
                </tr>
                <tr>
                    <td><a>Classes</a></td>
                    {% for i in classes %}
                        <td><a>{{ i }}</a></td>
                    {% endfor %}
                </tr>
        </tbody>
    </table>
</div>
{% endblock %}
