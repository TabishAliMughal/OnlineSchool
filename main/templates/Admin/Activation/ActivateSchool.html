{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <link href="{% static 'css/base.css' %}"/>
    <div class="container">
        <form method="POST">
            <h2 class="text-center" style="font-family:serif;">Activating School</h2><hr/>
            <table class="table table-hover table-sm res-table" id="act">
                <thead align="center">
                    <tr class="row100">
                        <th>School</th>
                    </tr>
                </thead>
                <tbody id="myTable" align="center">
                    <tr class="row100">
                        <td>
                            <select style="width: 50%; height:auto;" name="school" required>
                                <option>------------------------------------------------------</option>
                                {% for i in school %}
                                    <option value="{{ i.pk }}">{{ i }}</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input class="btn btn-primary" type="submit" value="Activate All Students" />
                        </td>
                    </tr>
                </tbody>
            </table>
            {% csrf_token %}
        </form>
    </div>
{% endblock %}
