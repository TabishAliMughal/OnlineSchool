{% extends "MainPage.html" %}
{% block content %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">All Registered Teachers</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody id="myTable" align="center">
                {% for i in teachers %}
                    <tr>
                        <th><a href="{% url 'admin_profile_detail' i.pk %}" >{{ i }}</a></th>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <h2 class="text-center" style="font-family:sans-serif;">All Registered Checkers</h2><hr/>
        <table class="table table-hover table-sm table-dark">
            <tbody id="myTable" align="center">
                {% for i in checkers %}
                    <tr>
                        <th><a href="{% url 'admin_profile_detail' i.pk %}" >{{ i }}</a></th>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
