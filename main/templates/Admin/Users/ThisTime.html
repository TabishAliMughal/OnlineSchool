{% extends "MainPage.html" %}
{% load static %}
{% block content %}
    <link href="{% static 'css/base.css' %}"/>
    <div class="container">
        <h2 class="text-center" style="font-family:serif;">All Active Users At This Time</h2><hr/>
        <table class="table table-hover table-sm res-table" id="act">
            <tbody>
                {% for i in cur_users %}
                    <tr>
                        <td style="text-align: center;">{{ i }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
