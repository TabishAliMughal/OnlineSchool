{% extends "MainPage.html" %}
{% block content %}
    <form method="POST">
        {% csrf_token %}
        <div class="container">
            <h2 class="text-center" style="font-family:sans-serif;">Creating My Class</h2><hr/>
            <h3>Warning :</h3><h5>You Wont Be Able To Change This Class Later</h5>
           <table  class="table table-hover table-sm res-table">
                <tbody id="myTable" align="center">
                    <tr>
                        <td>School Name</td>
                        <td>{{ form.school }}</td>
                    </tr>
                    <tr>
                        <td>Address</td>
                        <td>{{ form.address }}</td>
                    </tr>
                    <tr>
                        <td>Action</td>
                        <td><input class='btn btn-primary' type="submit" value="Save"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
{% endblock %}
