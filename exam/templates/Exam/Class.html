{% extends "MainPage.html" %}
{% block content %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">My Students</h2><hr/>
        <h5 class="text-center" style="font-family:sans-serif;">{{ exam }}</h5><hr/>
       <table  class="table table-hover table-sm res-table">
            <thead align="center">
                <tr>
                    <th>Name</th>
                    <th>Father</th>
                    <th>Action</th>
                    <th>Pics</th>
                </tr>
            </thead>
            <tbody id="myTable" align="center">
                {% for i in class %}
                    <tr>
                        <td>{{ i.name }}</td>
                        <td>{{ i.father_name }}</td>
                        <td><a class='btn' href="{% url 'exam_upload_pictures' exam.pk i.pk %}">Upload Answers</a></td>
                        <td>{{ i.picsqty }} Uploaded</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
