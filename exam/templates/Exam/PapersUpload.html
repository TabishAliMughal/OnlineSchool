{% extends "MainPage.html" %}
{% block content %}
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="container">
        <h2 class="text-center" style="font-family:sans-serif;">Upload Answers</h2><hr/>
        <h5>Adding Answer Papers Of {{student.name}}, Subject {{ exam.subject }}</h5>
        <table class="table table-hover table-sm table-dark">
            <tbody  align="center">
                <tr>
                    <th><input type="file" name="picture" accept="image/*" required id="id_picture" capture="camera"></th>
                </tr>
                <tr>
                    <th><input class="btn btn-primary" type="submit" value="Add"></th>
                </tr>
            </tbody>
        </table>
    </div>
</form>
{% endblock %}
